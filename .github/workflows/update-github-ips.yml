name: Update GitHub IPs

on:
  workflow_dispatch:
  schedule:
    - cron: '3 10 * * *'

jobs:
  update-github-ips:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore previous github-ips.json
        run: |
          cp github-ips.json github-ips-prev.json || touch github-ips-prev.json

      - name: Fetch GitHub IPs
        run: |
          curl -sSL https://api.github.com/meta | jq . > github-ips.json

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet github-ips.json; then
            git add github-ips.json
            git commit -m "Update GitHub IPs"
            git push
            echo "CHANGED=true" >> $GITHUB_ENV
          else
            echo "CHANGED=false" >> $GITHUB_ENV
          fi

      - name: Print IP diffs by purpose
        if: env.CHANGED == 'true'
        run: |
          cat <<'EOF' > print_ip_diff.sh
          #!/bin/bash
          jq -r '
            to_entries[]
            | select(.value | type == "array")
            | .key
          ' github-ips.json > keys.txt

          echo "## GitHub IP Changes by Purpose" > ip-diff-summary.txt
          for k in $(cat keys.txt); do
            echo "### $k" >> ip-diff-summary.txt
            jq -r --arg k "$k" '.[$k][]' github-ips.json | sort > new.txt
            jq -r --arg k "$k" '.[$k][]' github-ips-prev.json | sort > old.txt
            comm -13 old.txt new.txt > added.txt
            comm -23 old.txt new.txt > removed.txt
            if [ -s added.txt ]; then
              echo "**Added**:" >> ip-diff-summary.txt
              cat added.txt | sed 's/^/- /' >> ip-diff-summary.txt
            fi
            if [ -s removed.txt ]; then
              echo "**Removed**:" >> ip-diff-summary.txt
              cat removed.txt | sed 's/^/- /' >> ip-diff-summary.txt
            fi
          done
          EOF
          bash print_ip_diff.sh

      - name: Get summary for issue
        if: env.CHANGED == 'true'
        run: |
          echo "IP_DIFF_SUMMARY<<EOF" >> $GITHUB_ENV
          cat ip-diff-summary.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create issue if IPs updated
        if: env.CHANGED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'GitHub IPs Updated',
              assignees: ['evanallen13'],
              body: 'The GitHub IPs have been updated and committed to github-ips.json.\n\n' + process.env.IP_DIFF_SUMMARY
            })
