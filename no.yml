name: wk1

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  load-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 🔐 Login to Azure
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 🚀 Deploy to staging slot
      - name: Deploy to App Service staging slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: AppService160171089
          slot-name: staging
          package: .

      # 🧪 Run Azure Load Test
      - name: Run Load Test
        id: loadtest
        uses: azure/load-testing@v1
        with:
          loadTestConfigFile: test1.yml
          loadTestResource: lt60171089

      # ❌ Fail workflow if test fails
      - name: Fail if load test failed
        if: failure()
        run: exit 1

      # 📦 Upload results
      - name: Upload Load Test Results
        uses: actions/upload-artifact@v4
        with:
          name: loadTestResults
          path: loadTest/results.zip
